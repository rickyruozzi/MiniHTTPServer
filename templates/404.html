<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina non trovata</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #fff7ed;
        color: #7c2d12;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .card {
        background: white;
        padding: 32px 44px;
        border-radius: 14px;
        border: 1px solid #fdba74;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
      }

      p {
        margin: 0;
        color: #9a3412;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <p>La pagina richiesta non esiste.</p>
    </div>
  </body>
</html>
